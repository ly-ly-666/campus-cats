<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫咪档案</title>
  <link rel="stylesheet" href="./style.css?v=6">
  <style>
    .profile-header { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%); padding: 28px 20px; text-align: center; border-bottom: 1px solid var(--border); }
    .profile-avatar { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 6px 20px rgba(0,0,0,.12); margin-bottom: 12px; background: #ffd9a8; }
    .profile-name { font-size: 26px; font-weight: 700; }
    .profile-nick { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .profile-tags { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .profile-main { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 18px; }
    .profile-section { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .profile-section h3 { font-size: 15px; color: var(--primary-dark); margin-bottom: 12px; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .info-item { background: #faf6ef; border-radius: 10px; padding: 10px 12px; }
    .info-label { font-size: 11px; color: var(--muted); }
    .info-val { font-size: 14px; font-weight: 600; margin-top: 2px; }
    .story-text { line-height: 1.8; color: var(--text); white-space: pre-line; }
    .event-timeline { display: flex; flex-direction: column; gap: 12px; }
    .event-tl-item { border-left: 3px solid var(--primary); padding-left: 12px; }
    .event-tl-date { font-size: 12px; color: var(--muted); font-weight: 600; }
    .event-tl-text { font-size: 14px; margin-top: 4px; line-height: 1.6; }
    .event-imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 8px; }
    .event-imgs img { aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; width: 100%; }
    .profile-album { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .p-album-item { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #f0ebe2; border: 1px solid var(--border); }
    .p-album-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; display: block; }
    .back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--primary-dark); text-decoration: none; font-weight: 600; margin-bottom: 10px; }
    .not-found { text-align: center; padding: 60px 20px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="profile-header" id="profile-header"></div>
  <main class="profile-main" id="profile-main">
    <div class="loading">正在加载档案…</div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./js/profile.js?v=20260831g"></script>
</body>
</html>
