<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff8c1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <!-- ears -->
  <polygon points="90,170 118,70 190,120" fill="#e8632a"/>
  <polygon points="310,170 282,70 210,120" fill="#e8632a"/>
  <polygon points="101,158 122,95 175,127" fill="#f7b7a3"/>
  <polygon points="299,158 278,95 225,127" fill="#f7b7a3"/>
  <!-- head -->
  <circle cx="200" cy="210" r="120" fill="#f5a83d"/>
  <!-- eyes -->
  <circle cx="158" cy="200" r="16" fill="#fff"/>
  <circle cx="242" cy="200" r="16" fill="#fff"/>
  <circle cx="158" cy="202" r="8" fill="#2b2b2b"/>
  <circle cx="242" cy="202" r="8" fill="#2b2b2b"/>
  <circle cx="161" cy="199" r="3" fill="#fff"/>
  <circle cx="245" cy="199" r="3" fill="#fff"/>
  <!-- nose & mouth -->
  <polygon points="192,235 208,235 200,247" fill="#e8632a"/>
  <path d="M200,247 Q185,261 178,251" stroke="#b64a20" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M200,247 Q215,261 222,251" stroke="#b64a20" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#d98c2e" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="222" x2="60" y2="214"/>
    <line x1="120" y1="238" x2="58" y2="244"/>
    <line x1="280" y1="222" x2="340" y2="214"/>
    <line x1="280" y1="238" x2="342" y2="244"/>
  </g>
  <!-- cheek stripes -->
  <g stroke="#e07a24" stroke-width="5" stroke-linecap="round">
    <line x1="112" y1="240" x2="142" y2="252"/>
    <line x1="288" y1="240" x2="258" y2="252"/>
  </g>
  <!-- body hint -->
  <ellipse cx="200" cy="362" rx="130" ry="40" fill="#e8952f"/>
</svg>
