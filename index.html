<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园猫咪地图与族谱</title>

  <!-- Leaflet CSS（多 CDN 回退：jsdelivr → unpkg → cdnjs） -->
  <link rel="stylesheet" id="leaflet-css" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <script>
    (function () {
      var cssIdx = 0;
      var urls = [
        'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css',
        'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
        'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'
      ];
      var link = document.getElementById('leaflet-css');
      if (link) link.onerror = function () {
        cssIdx++;
        if (cssIdx < urls.length) link.href = urls[cssIdx];
      };
    })();
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">🐱 校园猫咪地图与族谱</h1>
    <nav class="tab-bar" aria-label="视图切换">
      <button class="tab-btn active" data-tab="map" type="button">🗺️ 地图分布</button>
      <button class="tab-btn" data-tab="graph" type="button">🌳 亲戚关系</button>
      <a class="tab-btn" href="./admin.html" title="在线编辑数据并自动部署" style="display:none">⚙️ 编辑</a>
    </nav>
  </header>

  <!-- 猫协宣传条（最显眼位置） -->
  <section class="cat-promo">
    <div class="cat-promo-inner">
      <div class="cat-promo-logo">🐱</div>
      <div class="cat-promo-text">
        <div class="cat-promo-title">校园猫咪地图 · 给每只小猫一个家</div>
        <div class="cat-promo-desc">本站由爱猫同学自发维护（与猫协无关）。所有内容仅作校园猫记录，如需认领 / 救助 / 投诉请联系猫协官方账号。</div>
      </div>
      <div class="cat-promo-accounts">
        <span class="cat-promo-tag">抖音</span>
        <span class="cat-promo-tag">小红书</span>
        <span class="cat-promo-tag">B 站</span>
        <span class="cat-promo-name">「这里油只喵」（猫协官方）</span>
      </div>
    </div>
  </section>

  <!-- 免责声明 -->
  <p class="site-disclaimer">本站为爱猫同学自发维护，与广油官微 / 猫协无官方隶属关系。内容仅供参考，猫猫信息可能滞后。如有错误欢迎指正。</p>

  <main class="app-main">
    <!-- 地图视图 -->
    <section id="map-view" class="view active">
      <div id="map" class="map-container"></div>
      <aside id="sidebar" class="sidebar">
        <h2 class="sidebar-title">猫咪列表（<span id="cat-count">0</span>）</h2>
        <div id="cat-list" class="cat-list"></div>
      </aside>
    </section>

    <!-- 关系图视图 -->
    <section id="graph-view" class="view">
      <div id="graph" class="graph-container"></div>
    </section>
  </main>

  <!-- 详情弹窗 -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <!-- 更正猫咪信息弹窗 -->
  <div id="correction-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" data-cclose="1"></div>
    <div class="modal-panel">
      <button class="modal-close" data-cclose="1" aria-label="关闭">×</button>
      <div class="modal-header">
        <div class="modal-title-block">
          <h2 class="modal-name">🐾 信息有误？帮我更正</h2>
        </div>
      </div>
      <p class="modal-desc" style="margin-top:6px;">你发现的猫猫信息问题会整理成文字，复制后发给站长（微信 / 邮件均可），站长核对后会尽快更新。</p>
      <div class="field" style="margin:12px 0 8px;">
        <label>🐱 涉及猫咪</label>
        <select id="corr-cat" class="corr-select"></select>
      </div>
      <div class="field" style="margin:8px 0;">
        <label>✍️ 哪里不对 / 实际看到的情况</label>
        <textarea id="corr-text" rows="4" placeholder="例如：小白已经搬到实验楼附近了 / 花花的毛色写错了 / 失踪状态其实还在图书馆…"></textarea>
      </div>
      <div class="corr-actions">
        <button class="btn btn-green" id="corr-copy">📋 复制内容发站长</button>
        <button class="btn" id="corr-mail">✉️ 用邮件发送</button>
      </div>
      <p class="corr-note">复制后粘贴到微信发给站长即可。邮件地址在站长设置里配置。</p>
    </div>
  </div>

  <!-- 更正信息浮动按钮 -->
  <button id="corr-fab" class="corr-fab" title="更正猫咪信息">🐾</button>

  <!-- 加载提示 -->
  <div id="loading" class="loading">正在加载猫咪数据…</div>

  <!-- 消息提示 -->
  <div id="toast" class="toast" role="status"></div>

  <!-- Leaflet JS（多 CDN 回退，document.write 同步加载，保证入口模块执行前已就绪） -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
          onerror="window.__leafletIdx=(window.__leafletIdx||0)+1;if(window.__leafletIdx===1){document.write('<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'><\/script>')}else if(window.__leafletIdx===2){document.write('<script src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'><\/script>')}"></script>

  <!-- ECharts（同样三级回退） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"
          onerror="window.__echartsIdx=(window.__echartsIdx||0)+1;if(window.__echartsIdx===1){document.write('<script src='https://unpkg.com/echarts@5.5.1/dist/echarts.min.js'><\/script>')}else if(window.__echartsIdx===2){document.write('<script src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js'><\/script>')}"></script>

  <!-- 入口模块 -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
