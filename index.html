<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园猫咪地图与族谱</title>

  <!-- Leaflet CSS（多 CDN 回退：jsdelivr → unpkg → cdnjs） -->
  <link rel="stylesheet" id="leaflet-css" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <script>
    (function () {
      var cssIdx = 0;
      var urls = [
        'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css',
        'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css',
        'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'
      ];
      var link = document.getElementById('leaflet-css');
      if (link) link.onerror = function () {
        cssIdx++;
        if (cssIdx < urls.length) link.href = urls[cssIdx];
      };
    })();
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">🐱 校园猫咪地图与族谱</h1>
    <nav class="tab-bar" aria-label="视图切换">
      <button class="tab-btn active" data-tab="map" type="button">🗺️ 地图分布</button>
      <button class="tab-btn" data-tab="graph" type="button">🌳 亲戚关系</button>
      <a class="tab-btn" href="./admin.html" title="在线编辑数据并自动部署">⚙️ 编辑</a>
    </nav>
  </header>

  <main class="app-main">
    <!-- 地图视图 -->
    <section id="map-view" class="view active">
      <div id="map" class="map-container"></div>
      <aside id="sidebar" class="sidebar">
        <h2 class="sidebar-title">猫咪列表（<span id="cat-count">0</span>）</h2>
        <div id="cat-list" class="cat-list"></div>
      </aside>
    </section>

    <!-- 关系图视图 -->
    <section id="graph-view" class="view">
      <div id="graph" class="graph-container"></div>
    </section>
  </main>

  <!-- 详情弹窗 -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true"></div>

  <!-- 加载提示 -->
  <div id="loading" class="loading">正在加载猫咪数据…</div>

  <!-- 消息提示 -->
  <div id="toast" class="toast" role="status"></div>

  <!-- Leaflet JS（多 CDN 回退，document.write 同步加载，保证入口模块执行前已就绪） -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
          onerror="window.__leafletIdx=(window.__leafletIdx||0)+1;if(window.__leafletIdx===1){document.write('<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'><\/script>')}else if(window.__leafletIdx===2){document.write('<script src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'><\/script>')}"></script>

  <!-- ECharts（同样三级回退） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"
          onerror="window.__echartsIdx=(window.__echartsIdx||0)+1;if(window.__echartsIdx===1){document.write('<script src='https://unpkg.com/echarts@5.5.1/dist/echarts.min.js'><\/script>')}else if(window.__echartsIdx===2){document.write('<script src='https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js'><\/script>')}"></script>

  <!-- 入口模块 -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
